---
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: argocd
  namespace: argocd
spec:
  interval: 24h
  url: https://argoproj.github.io/argo-helm 
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argocd
  namespace: argocd
spec:
  interval: 30m
  dependsOn:
    - name: ingress-nginx
      namespace: ingress-nginx
  chart:
    spec:
      chart: argo-cd
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: argocd
        namespace: argocd
      interval: 12h
  values:
    global:
      domain: localhost
    fullnameOverride: "argocd"
    dex:
      enabled: false
    notifications:
      enabled: false
    configs:
      params:
        server.insecure: "true"
        server.rootpath: '/argocd'
    server:
      ingress:
        enabled: true
        hostname: localhost
        path: /argocd
        pathType: ImplementationSpecific
        annotations:
          nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
          #nginx.ingress.kubernetes.io/ssl-passthrough: "true"